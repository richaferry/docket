name: Migrate production database

# Applies pending Drizzle migrations to the Neon production database whenever
# code lands on main. Vercel auto-deploys on the same event; the app's pages
# are force-dynamic (no build-time DB reads), so this job and the Vercel build
# can safely run concurrently.
#
# Secrets (set in the repo Settings > Secrets and variables > Actions):
#   NEON_DATABASE_URL_UNPOOLED — Neon direct (unpooled) connection string.
#   NEON_DATABASE_URL          — optional fallback pooled URL if the above is
#                                not set (migrations prefer the unpooled one).

on:
  push:
    branches: [main]

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED || secrets.NEON_DATABASE_URL }}
