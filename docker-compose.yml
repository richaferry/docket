services:
  docket:
    build:
      context: .
      dockerfile: Dockerfile
    image: docket:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
    volumes:
      # SQLite database lives here — survives container restarts/recreates.
      - docket-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  docket-data:
