# Development environment
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-docket-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: docket
      POSTGRES_DB: docket
    ports:
      - "5403:5432"
    volumes:
      - dev-docket-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docket"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dev-docket-pg-data:
