# Development environment: hot-reloads on your host source changes.
#
#   cp .env.example .env
#   docker compose -f docker-compose.dev.yml up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: docket
      POSTGRES_DB: docket
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docket"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  docket:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: docket:dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - DATABASE_URL=postgres://docket:docket@postgres:5432/docket
    volumes:
      # Live source — edits on the host hot-reload inside the container.
      - .:/app
      # Keep container-installed deps/build artifacts (don't shadow with host).
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run db:migrate && npm run dev"

volumes:
  postgres-data:
